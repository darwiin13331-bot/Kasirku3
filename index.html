<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KasirKu Pro v3 HTML</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--primary:#2563eb;--danger:#dc2626;--ok:#16a34a;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:white;font-weight:700}.secondary{background:#eef2ff;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.muted{color:var(--muted)}.hidden{display:none!important}.app{min-height:100vh}.top{background:#111827;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.brand{font-weight:800}.layout{display:flex;min-height:calc(100vh - 58px)}.side{width:230px;background:#fff;border-right:1px solid var(--border);padding:14px}.side button{width:100%;text-align:left;margin:4px 0;background:transparent;color:#334155}.side button.active,.side button:hover{background:#eff6ff;color:#1d4ed8}.main{flex:1;padding:20px;max-width:1500px;margin:auto;width:100%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 3px 14px #00000008}.stat b{font-size:25px;display:block;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{min-width:180px}.input{width:100%;padding:11px 12px;border:1px solid #d6dbe5;border-radius:10px;background:#fff}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{font-size:13px;color:var(--muted)}.pos{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.prod{padding:14px;text-align:left;background:#fff;color:var(--text);border:1px solid var(--border)}.prod small{display:block;color:var(--muted);margin-top:5px}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.qty{display:flex;align-items:center;gap:5px}.qty button{padding:5px 9px}.totalbox{font-size:18px}.totalbox .grand{font-size:28px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modalbox{background:#fff;border-radius:16px;width:min(600px,100%);padding:20px;max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:13px;color:var(--muted)}.formgrid input,.formgrid select{margin-top:5px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(420px,100%)}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;margin:12px 0}.dangertext{color:var(--danger)}.qris{max-width:360px;margin:15px auto;text-align:center}.qris img{max-width:100%;border:10px solid #fff;box-shadow:0 2px 12px #0002}.bottomnav{display:none}.low{color:#b45309;font-weight:700}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}.side{display:none}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:20;overflow:auto}.bottomnav button{flex:1;background:white;color:#475569;border-radius:0;font-size:11px;padding:9px 5px}.main{padding-bottom:80px}}@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}.top{padding:12px}.main{padding:12px}}
</style></head><body><div id="root"></div><div id="modal"></div>
<script>
const KEY='kasirku_pro_v3_html';
const seed={users:[{username:'admin',password:'admin123',role:'ADMIN'},{username:'kasir',password:'kasir123',role:'KASIR'}],products:[{id:1,name:'Kopi Hitam',barcode:'899000000001',price:5000,cost:2500,stock:50,category:'Minuman'},{id:2,name:'Mie Instan',barcode:'899000000002',price:3500,cost:2000,stock:100,category:'Makanan'},{id:3,name:'Air Mineral',barcode:'899000000003',price:3000,cost:1500,stock:80,category:'Minuman'}],customers:[],sales:[],stockMoves:[]};
let db=load(),session=null,cart=[] ,page='kasir';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){let d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function uid(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
function root(){return document.getElementById('root')}
function nav(){let items=session&&session.role==='ADMIN'?[['kasir','🛒 Kasir'],['produk','📦 Produk'],['stok','↕️ Stok'],['pelanggan','👤 Pelanggan'],['laporan','📊 Laporan'],['backup','💾 Backup'],['qris','▣ QRIS']]:[['kasir','🛒 Kasir'],['produk','📦 Produk'],['laporan','📊 Laporan'],['qris','▣ QRIS']];return items.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}
function render(){if(!session){renderLogin();return}root().innerHTML=`<div class="app"><div class="top"><div class="brand">KasirKu Pro v3 <span class="muted">HTML</span></div><div>${esc(session.username)} · ${esc(session.role)} <button class="secondary" onclick="logout()">Keluar</button></div></div><div class="layout"><aside class="side">${nav()}</aside><main class="main">${content()}</main></div><div class="bottomnav">${nav()}</div></div>`}
function renderLogin(){root().innerHTML=`<div class="login"><div class="card loginbox"><h1>KasirKu Pro</h1><p class="muted">Versi HTML • data tersimpan di browser</p><div class="notice">Demo: <b>admin / admin123</b> atau <b>kasir / kasir123</b></div><label>Username</label><input id="lu" class="input" value="admin"><br><br><label>Password</label><input id="lp" class="input" type="password" value="admin123"><br><br><button style="width:100%" onclick="login()">Masuk</button></div></div>`}
function login(){let u=lu.value.trim(),p=lp.value;let x=db.users.find(a=>a.username===u&&a.password===p);if(!x)return alert('Username/password salah');session={username:x.username,role:x.role};page='kasir';render()}
function logout(){session=null;cart=[];render()}
function go(p){page=p;render()}
function content(){switch(page){case'kasir':return cashier();case'produk':return products();case'stok':return stock();case'pelanggan':return customers();case'laporan':return reports();case'backup':return backup();case'qris':return qris();default:return ''}}
function cashier(){let sub=cart.reduce((s,x)=>s+x.price*x.qty,0);return `<h2>Kasir</h2><div class="pos"><section><div class="card"><div class="toolbar"><input id="search" class="input" placeholder="Cari nama / barcode..." oninput="filterProducts()"><button onclick="scanBarcode()">SCAN / BARCODE</button></div><div id="plist" class="products">${productCards(db.products)}</div></div></section><aside><div class="card"><h3>Keranjang</h3><div id="cart">${cart.length?cart.map(cartRow).join(''):'<p class="muted">Belum ada item.</p>'}</div><hr><div class="totalbox">Subtotal <span style="float:right">${money(sub)}</span></div><label>Diskon</label><input id="disc" class="input" type="number" min="0" value="0"><label>Uang dibayar</label><input id="paid" class="input" type="number" min="0" placeholder="0"><div class="totalbox" style="margin-top:12px">Total<div class="grand">${money(sub)}</div></div><button style="width:100%;margin-top:12px" onclick="checkout()">BAYAR & SIMPAN</button></div></aside></div>`}
function productCards(arr){return arr.map(p=>`<button class="prod" onclick="addCart(${p.id})"><b>${esc(p.name)}</b><small>${esc(p.category||'-')} · stok ${p.stock}</small><strong>${money(p.price)}</strong></button>`).join('')||'<p class="muted">Produk tidak ditemukan.</p>'}
function filterProducts(){let q=search.value.toLowerCase();plist.innerHTML=productCards(db.products.filter(p=>p.name.toLowerCase().includes(q)||String(p.barcode||'').includes(q)))}
function scanBarcode(){let b=prompt('Masukkan barcode:');if(!b)return;let p=db.products.find(x=>x.barcode===b);if(!p)return alert('Barcode tidak ditemukan');addCart(p.id)}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p)return;if(p.stock<=0)return alert('Stok habis');let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert('Stok tidak cukup');x.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});render()}
function cartRow(x){return `<div class="cartrow"><div><b>${esc(x.name)}</b><br><span class="muted">${money(x.price)} × ${x.qty}</span></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button><b>${money(x.price*x.qty)}</b><button onclick="changeQty(${x.id},1)">+</button></div></div>`}
function changeQty(id,d){let x=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);else if(x.qty>p.stock)x.qty=p.stock;render()}
function checkout(){if(!cart.length)return alert('Keranjang kosong');let sub=cart.reduce((s,x)=>s+x.price*x.qty,0),discount=Math.min(Number(document.getElementById('disc').value||0),sub),total=sub-discount,paid=Number(document.getElementById('paid').value||0);if(paid<total)return alert('Pembayaran kurang '+money(total-paid));for(let x of cart){let p=db.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty)return alert('Stok tidak cukup: '+x.name)}let sale={id:uid(db.sales),createdAt:Date.now(),subtotal:sub,total,discount,payment:paid,change:paid-total,user:session.username,items:cart.map(x=>({...x,cost:db.products.find(p=>p.id===x.id).cost}))};for(let x of cart)db.products.find(p=>p.id===x.id).stock-=x.qty;db.sales.push(sale);save();if(confirm(`Transaksi #${sale.id}\nTotal: ${money(total)}\nKembalian: ${money(sale.change)}\n\nCetak struk sekarang?`))printReceipt(sale);cart=[];render()}
function printReceipt(sale){let w=window.open('','_blank','width=420,height=650');if(!w)return alert('Popup diblokir browser. Izinkan popup untuk mencetak struk.');let rows=sale.items.map(i=>`<tr><td>${esc(i.name)} x${i.qty}</td><td style="text-align:right">${money(i.price*i.qty)}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><title>Struk #${sale.id}</title><style>body{font-family:monospace;width:280px;margin:20px auto;font-size:12px}h2{text-align:center;margin:0 0 8px}p{margin:4px 0}table{width:100%;border-collapse:collapse}td{padding:3px 0}.line{border-top:1px dashed #000;margin:8px 0}.total{font-weight:bold;font-size:14px}</style></head><body><h2>KasirKu Pro</h2><p>Transaksi #${sale.id}</p><p>${new Date(sale.createdAt).toLocaleString('id-ID')}</p><p>Kasir: ${esc(sale.user)}</p><div class="line"></div><table>${rows}</table><div class="line"></div><p>Subtotal: ${money(sale.subtotal)}</p><p>Diskon: ${money(sale.discount)}</p><p class="total">TOTAL: ${money(sale.total)}</p><p>Bayar: ${money(sale.payment)}</p><p>Kembali: ${money(sale.change)}</p><div class="line"></div><p style="text-align:center">Terima kasih</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function products(){return `<h2>Produk</h2><div class="toolbar"><button onclick="productForm()">+ Tambah Produk</button><input id="pq" class="input" placeholder="Cari produk..." oninput="productTable()"></div><div class="card tablewrap"><div id="pt">${productTableHtml(db.products)}</div></div>`}
function productTable(){pt.innerHTML=productTableHtml(db.products.filter(p=>p.name.toLowerCase().includes(pq.value.toLowerCase())||String(p.barcode||'').includes(pq.value)))}
function productTableHtml(arr){return `<table class="table"><thead><tr><th>Produk</th><th>Barcode</th><th>Jual</th><th>Modal</th><th>Stok</th><th>Kategori</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.barcode)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td class="${p.stock<=5?'low':''}">${p.stock}</td><td>${esc(p.category)}</td><td><button class="secondary" onclick="productForm(${p.id})">Edit</button> <button class="danger" onclick="delProduct(${p.id})">Hapus</button></td></tr>`).join('')}</tbody></table>`}
function productForm(id){let p=db.products.find(x=>x.id===id)||{name:'',barcode:'',price:0,cost:0,stock:0,category:''};openModal(`<h3>${id?'Edit':'Tambah'} Produk</h3><div class="formgrid"><label>Nama<input id="fn" class="input" value="${esc(p.name)}"></label><label>Barcode<input id="fb" class="input" value="${esc(p.barcode)}"></label><label>Harga jual<input id="fp" class="input" type="number" value="${p.price}"></label><label>Harga modal<input id="fc" class="input" type="number" value="${p.cost}"></label><label>Stok<input id="fs" class="input" type="number" value="${p.stock}"></label><label>Kategori<input id="fcat" class="input" value="${esc(p.category)}"></label></div><div class="actions"><button class="secondary" onclick="closeModal()">Batal</button><button onclick="saveProduct(${id||0})">Simpan</button></div>`)}
function saveProduct(id){let name=fn.value.trim();if(!name)return alert('Nama wajib diisi');let p=id?db.products.find(x=>x.id===id):{id:uid(db.products)};Object.assign(p,{name,barcode:fb.value.trim(),price:Number(fp.value||0),cost:Number(fc.value||0),stock:Number(fs.value||0),category:fcat.value.trim()});if(!id)db.products.push(p);save();closeModal();render()}
function delProduct(id){if(!confirm('Hapus produk ini?'))return;db.products=db.products.filter(p=>p.id!==id);cart=cart.filter(x=>x.id!==id);save();render()}
function stock(){return `<h2>Stok Masuk / Keluar</h2><div class="card tablewrap"><table class="table"><thead><tr><th>Produk</th><th>Stok</th><th>Aksi</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="${p.stock<=5?'low':''}">${p.stock}</td><td><button class="ok" onclick="stockForm(${p.id},'IN')">Stok Masuk</button> <button class="danger" onclick="stockForm(${p.id},'OUT')">Stok Keluar</button></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:15px"><h3>Riwayat Mutasi</h3>${db.stockMoves.slice().reverse().slice(0,30).map(m=>`<p>${new Date(m.at).toLocaleString('id-ID')} · ${esc(m.kind)} · ${esc(m.name)} · ${m.qty} · ${esc(m.note||'')}</p>`).join('')||'<p class="muted">Belum ada mutasi.</p>'}</div>`}
function stockForm(id,kind){let p=db.products.find(x=>x.id===id);openModal(`<h3>${kind==='IN'?'Stok Masuk':'Stok Keluar'} — ${esc(p.name)}</h3><label>Jumlah<input id="sq" class="input" type="number" min="1" value="1"></label><br><label>Catatan<input id="sn" class="input"></label><div class="actions"><button class="secondary" onclick="closeModal()">Batal</button><button onclick="saveStock(${id},'${kind}')">Simpan</button></div>`)}
function saveStock(id,kind){let q=Number(sq.value||0),p=db.products.find(x=>x.id===id);if(q<=0)return alert('Jumlah tidak valid');if(kind==='OUT'&&p.stock<q)return alert('Stok tidak cukup');p.stock+=kind==='IN'?q:-q;db.stockMoves.push({id:uid(db.stockMoves),productId:id,name:p.name,qty:q,kind,note:sn.value,at:Date.now(),user:session.username});save();closeModal();render()}
function customers(){return `<h2>Pelanggan</h2><div class="toolbar"><button onclick="customerForm()">+ Tambah Pelanggan</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Nama</th><th>Telepon</th></tr></thead><tbody>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">Belum ada pelanggan.</td></tr>'}</tbody></table></div>`}
function customerForm(){openModal(`<h3>Pelanggan Baru</h3><label>Nama<input id="cn" class="input"></label><br><label>Telepon<input id="cp" class="input"></label><div class="actions"><button class="secondary" onclick="closeModal()">Batal</button><button onclick="saveCustomer()">Simpan</button></div>`)}
function saveCustomer(){if(!cn.value.trim())return alert('Nama wajib diisi');db.customers.push({id:uid(db.customers),name:cn.value.trim(),phone:cp.value.trim()});save();closeModal();render()}
function reports(){let s=db.sales.filter(x=>x.createdAt>=today()),om=s.reduce((a,x)=>a+x.total,0),profit=s.reduce((a,x)=>a+x.items.reduce((z,i)=>z+(i.price-i.cost)*i.qty,0),0)-s.reduce((a,x)=>a+x.discount,0),low=db.products.filter(p=>p.stock<=5);return `<h2>Laporan</h2><div class="grid"><div class="card stat">Transaksi hari ini<b>${s.length}</b></div><div class="card stat">Omzet hari ini<b>${money(om)}</b></div><div class="card stat">Laba kotor estimasi<b>${money(profit)}</b></div><div class="card stat">Stok menipis<b>${low.length}</b></div></div><div class="card" style="margin-top:15px"><h3>Stok Menipis</h3>${low.map(p=>`<p class="low">${esc(p.name)} — ${p.stock}</p>`).join('')||'<p class="muted">Tidak ada stok menipis.</p>'}</div><div class="card" style="margin-top:15px"><h3>Transaksi Terbaru</h3><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Waktu</th><th>Total</th><th>Kasir</th></tr>${db.sales.slice().reverse().slice(0,50).map(x=>`<tr><td>#${x.id}</td><td>${new Date(x.createdAt).toLocaleString('id-ID')}</td><td>${money(x.total)}</td><td>${esc(x.user)}</td></tr>`).join('')}</table></div></div>`}
function backup(){return `<h2>Backup & Restore</h2><div class="grid"><div class="card"><h3>Backup Produk</h3><p class="muted">Simpan produk ke file JSON.</p><button onclick="downloadBackup()">Download JSON</button></div><div class="card"><h3>Restore Produk</h3><p class="muted">Impor file backup JSON.</p><input id="restore" type="file" accept="application/json" onchange="restoreFile(this)"></div><div class="card"><h3>Export Penjualan</h3><p class="muted">Unduh transaksi dalam CSV.</p><button onclick="downloadCSV()">Download CSV</button></div><div class="card"><h3>Reset Data</h3><p class="dangertext">Menghapus data lokal aplikasi.</p><button class="danger" onclick="resetData()">Reset</button></div></div>`}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadBackup(){download('kasirku-backup.json',JSON.stringify({version:3,products:db.products},null,2),'application/json')}
function downloadCSV(){let rows=[['id','tanggal','subtotal','diskon','total','pembayaran','kembalian','kasir']];db.sales.forEach(x=>rows.push([x.id,new Date(x.createdAt).toISOString(),x.subtotal,x.discount,x.total,x.payment,x.change,x.user]));download('penjualan.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function restoreFile(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.products))throw 0;x.products.forEach(p=>{let old=db.products.find(a=>a.barcode&&a.barcode===p.barcode);if(old)Object.assign(old,p);else db.products.push({...p,id:uid(db.products)})});save();alert('Restore berhasil');render()}catch(e){alert('Backup tidak valid')}};r.readAsText(f)}
function resetData(){if(!confirm('Yakin reset semua data?'))return;db=structuredClone(seed);save();cart=[];render()}
function qris(){return `<h2>QRIS</h2><div class="card qris"><p class="muted">Masukkan payload QRIS / teks pembayaran. Generator menggunakan layanan QR online.</p><textarea id="qp" class="input" rows="5" placeholder="Tempel payload QRIS di sini"></textarea><br><button onclick="makeQR()">BUAT QR</button><div id="qrout"></div></div>`}
function makeQR(){let v=encodeURIComponent(qp.value.trim());if(!v)return alert('Payload wajib diisi');qrout.innerHTML=`<img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${v}"><p class="muted">QR dibuat dari payload yang dimasukkan.</p>`}
function openModal(html){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${html}</div></div>`}function closeModal(){modal.innerHTML=''}
render();
</script></body></html>
